name: Stable Release on Tag

on:
  push:
    tags:
      - 'v*'   # Solo tags que empiecen con "v"

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/build-results

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        desktop: [PHOSH, PLAMO]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build (.env)
        run: |
          DEVICE=$(grep -m1 '^DEVICE=' .env | cut -d'"' -f2)
          [ -n "$DEVICE" ] || { echo "❌ DEVICE not found in .env"; exit 1; }
          sed -i "s/^DESKTOP=.*/DESKTOP=\"${{ matrix.desktop }}\"/" .env
          echo "DEVICE=${DEVICE}" >> $GITHUB_ENV
          echo "🎯 Building ${{ matrix.desktop }} image for ${DEVICE}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            abootimg \
            android-sdk-libsparse-utils \
            mkbootimg

      - name: Prepare build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Run build script
        run: sudo bash all.sh
        shell: bash

      - name: Set date and version
        run: |
          DATE_TAG=$(date +'%Y%m%d')
          VERSION_TAG=${GITHUB_REF##*/}
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Package generated files
        run: |
          ZIP_FILE="${{ env.BUILD_DIR }}/openSUSE-Tumbleweed-ARM-${{ matrix.desktop }}-${{ env.DEVICE }}_${{ env.VERSION_TAG }}.zip"
          echo "📦 Empaquetando archivos en: $ZIP_FILE"
          shopt -s nullglob
          FILES=(openSUSE*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No se encontraron archivos que comiencen por 'openSUSE'"
            exit 1
          fi
          zip -r "$ZIP_FILE" "${FILES[@]}"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-${{ matrix.desktop }}
          path: ${{ env.BUILD_DIR }}/*.zip
          if-no-files-found: error

      - name: Clean up
        run: sudo rm -rf ${{ env.BUILD_DIR }}

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION_TAG=${GITHUB_REF##*/}
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Delete previous release with same tag if exists
        run: |
          gh release delete "${{ env.VERSION_TAG }}" --yes || true
          git tag -d "${{ env.VERSION_TAG }}" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create stable release
        run: |
          gh release create "${{ env.VERSION_TAG }}" \
            dist/*.zip \
            --title "Opensuse Mobile - Stable - ${{ env.VERSION_TAG }}" \
            --notes "Stable PHOSH & PLAMO release for Oneplus 6/6t (enchilada/fajita) from tag ${{ env.VERSION_TAG }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
