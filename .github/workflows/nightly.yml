name: Nightly Build (all.sh)

on:
  schedule:
    - cron: "0 21 * * *"  # Ejecuta a las 21:00 UTC cada noche
  workflow_dispatch:        # Permite ejecución manual

permissions:
  contents: write

env:
  BUILD_DIR: /tmp/build-results

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        desktop: [PHOSH, PLAMO]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure build (.env)
        run: |
          DEVICE=$(grep -m1 '^DEVICE=' .env | cut -d'"' -f2)
          [ -n "$DEVICE" ] || { echo "❌ DEVICE not found in .env"; exit 1; }
          sed -i "s/^DESKTOP=.*/DESKTOP=\"${{ matrix.desktop }}\"/" .env
          echo "DEVICE=${DEVICE}" >> $GITHUB_ENV
          echo "🎯 Building ${{ matrix.desktop }} image for ${DEVICE}"

      - name: Install dependencies
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y \
            zip \
            abootimg \
            android-sdk-libsparse-utils \
            mkbootimg

      - name: Verify installed tools
        run: |
          echo "🔧 Verificando herramientas..."
          which losetup || echo "⚠️ losetup no encontrado"
          which abootimg || echo "⚠️ abootimg no encontrado"
          which mkbootimg || echo "⚠️ mkbootimg no encontrado"
          which simg2img || echo "⚠️ simg2img no encontrado"
          which img2simg || echo "⚠️ img2simg no encontrado"

      - name: Prepare build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Run build script
        run: |
          echo "🚀 Ejecutando all.sh con privilegios de administrador..."
          sudo bash all.sh
        shell: bash

      - name: Set date format (YYYY.MM.DD)
        id: date
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Package generated files
        run: |
          ZIP_FILE="${{ env.BUILD_DIR }}/openSUSE-Tumbleweed-ARM-${{ matrix.desktop }}-${{ env.DEVICE }}_${{ env.DATE_TAG }}-nightly.zip"
          echo "📦 Empaquetando archivos en: $ZIP_FILE"
          shopt -s nullglob
          FILES=(openSUSE*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "❌ No se encontraron archivos que comiencen por 'openSUSE'"
            exit 1
          fi
          zip -r "$ZIP_FILE" "${FILES[@]}"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.desktop }}
          path: ${{ env.BUILD_DIR }}/*.zip
          if-no-files-found: error

      - name: Clean up
        run: sudo rm -rf ${{ env.BUILD_DIR }}

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set date format (YYYY.MM.DD)
        id: date
        run: echo "DATE_TAG=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: List artifacts
        run: |
          ls -la dist
          FILES=(dist/*.zip)
          echo "📦 Artifacts: ${#FILES[@]} zips"

      - name: Delete previous nightly release if exists
        run: |
          gh release delete nightly-v${{ env.DATE_TAG }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create new nightly release
        run: |
          gh release create nightly-v${{ env.DATE_TAG }} \
            dist/*.zip \
            --title "Nightly Build - ${{ env.DATE_TAG }}" \
            --notes "Automated nightly PHOSH & PLAMO build for Oneplus 6/6t (enchilada & fajita) on ${{ env.DATE_TAG }}" \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
